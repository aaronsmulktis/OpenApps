# Cross-app tasks anchored on the OpenBanking app.
#
# Standalone file: run with `tasks=openbanking` (Hydra) or load directly.
# Deliberately NOT folded into `all_tasks`, which is the paper's canonical
# 30-task inventory -- adding to it would silently change what a default sweep
# measures.
#
# ---------------------------------------------------------------------------
# Why these look different from `longer_horizon`
#
# longer_horizon quotes every value the agent must produce verbatim in the
# goal, so the goal text alone is sufficient to solve the task. These do the
# opposite on purpose: the *value* is not in the goal, it is in the bank's
# ledger, and the agent has to read the right cell out of the right account
# before it can act. The scorable delta still lands in todo/calendar/messenger
# because OpenBanking is read-only (see openbanking_app/main.py), so what is
# actually being measured is information retrieval under UI variation --
# whether the agent can still find the figure when the ledger is a card list,
# in German, buried under a wall of ACH addenda, or sitting next to a
# description that lies about it.
#
# Two consequences worth knowing before editing:
#
#   * Every expected value below is a figure or name from
#     `config/apps/openbanking/content/default.yaml`. The content variants
#     translate labels and descriptions but hold all amounts, balances and
#     account names fixed, so one expected answer is correct in every variant.
#     If you change a seeded amount, change it in all six content files.
#
#   * AppStateComparison compares strings through
#     StringSimilarityOperator.normalize_string, which lowercases and strips
#     everything matching [^\w\s]. So "1078.81", "$1,078.81" and "1078 81" all
#     normalize to "107881" and all pass. The formatting instructions in the
#     goals are therefore guidance for the agent, not a trap -- the reward does
#     not hinge on the currency symbol, comma or decimal point.
#
# `browsergym_env_args.max_steps` defaults to 10, which is not enough for the
# composites here (open the bank, find the account, read a figure, cross to a
# second app, submit). Raise it per-sweep.


# ==========================================================================
# Navigation (1 app) -- smoke test for the app's URL registration
# ==========================================================================

navigate_to_openbanking:
  _target_: open_apps.tasks.tasks.NavigateToAppTask
  goal: Navigate to the OpenBanking app.
  source_app: start_page
  target_app: openbanking


# ==========================================================================
# Read-then-act (2 apps / 1 sub-goal)
# ==========================================================================

add_todo_to_review_largest_card_charge:
  _target_: open_apps.tasks.tasks.AddToDoTask
  goal: Open the OpenBanking app and look at the 'BUS COMPLETE CHK (...5555)'
    account. Among its transactions, find the one of type 'Card' with the
    largest amount charged to the account. Then add a todo naming that amount,
    in the form 'Review charge AMOUNT' — for example, if the charge were twelve
    dollars and thirty-four cents you would add 'Review charge 12.34'.
  todo_name: Review charge 1078.81
  is_done: false

message_bob_the_savings_balance:
  _target_: open_apps.tasks.tasks.SendMessageTask
  goal: In the OpenBanking app, look up the available balance of the
    'BUS SELECT SAVINGS (...8891)' account. Then send Bob a message containing
    just that number and nothing else — for example, if the balance were one
    hundred dollars you would send '100.00'.
  to: Bob
  message: '24310.55'


# ==========================================================================
# Read-then-act composites (2-3 apps / 2 sub-goals)
# ==========================================================================

log_business_card_charges_as_todos:
  _target_: open_apps.tasks.tasks.CompositeTask
  _convert_: all
  goal: Open the 'INK BUSINESS CARD (...2043)' account in the OpenBanking app.
    It has exactly two transactions of type 'Card'. For each one, add a todo
    named 'Card AMOUNT', where AMOUNT is that transaction's amount — for
    example, 'Card 12.34'. Add one todo per card transaction, so two in total.
    Ignore any transaction that is not of type 'Card'.
  subtasks:
  - _target_: open_apps.tasks.tasks.AddToDoTask
    goal: Add a todo for the cloud hosting card charge.
    todo_name: Card 412.00
    is_done: false
  - _target_: open_apps.tasks.tasks.AddToDoTask
    goal: Add a todo for the office supplies card charge.
    todo_name: Card 212.44
    is_done: false

note_pending_transfer_in_calendar_and_todo:
  _target_: open_apps.tasks.tasks.CompositeTask
  _convert_: all
  goal: The 'BUS COMPLETE CHK (...5555)' account in the OpenBanking app has one
    transaction that is still pending. Add a calendar event on September 1st of
    2026 titled 'Confirm pending transfer', leaving the description, location
    and URL empty and adding no invitees. Then add a todo named
    'Pending AMOUNT', where AMOUNT is the pending transaction's amount — for
    example, 'Pending 12.34'.
  subtasks:
  - _target_: open_apps.tasks.tasks.AddEventTask
    goal: Add the confirmation event to the calendar.
    title: Confirm pending transfer
    date: 2026-09-01
    description: null
    location: null
    url: null
    invitees: []
  - _target_: open_apps.tasks.tasks.AddToDoTask
    goal: Add a todo naming the pending amount.
    todo_name: Pending 5000.00
    is_done: false

reconcile_the_largest_account:
  _target_: open_apps.tasks.tasks.CompositeTask
  _convert_: all
  goal: The OpenBanking app lists three accounts. Work out which one has the
    highest available balance. Send Alice a message containing that account's
    name exactly as OpenBanking shows it, and nothing else. Then add a todo
    named 'Reconcile NAME', using the same account name.
  subtasks:
  - _target_: open_apps.tasks.tasks.SendMessageTask
    goal: Tell Alice which account holds the most.
    to: Alice
    message: BUS SELECT SAVINGS (...8891)
  - _target_: open_apps.tasks.tasks.AddToDoTask
    goal: Add a reconciliation todo for that account.
    todo_name: Reconcile BUS SELECT SAVINGS (...8891)
    is_done: false
