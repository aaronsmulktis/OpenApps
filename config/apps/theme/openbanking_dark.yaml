# @package apps.theme
# Dark counterpart of `openbanking`, kept on-brand rather than reusing the
# shared `dark` theme (which is a high-contrast pure black/white port of the
# old todo `dark_theme` appearance and throws the bank palette away).
#
# Same token names as `openbanking`, so any app styled against that theme
# swaps between the two with no CSS changes.
name: openbanking_dark
import_url: ""
tokens:
  color-bg: "#0f171f"
  color-surface: "#1c2530"
  color-fg: "#f5f7fa"
  color-muted: "#a8b3bd"
  color-border: "#434f5b"
  color-primary: "#3f9cf3"
  color-primary-hover: "#68b3f6"   # lifts rather than darkens; a darker hover disappears into the page
  color-on-primary: "#0f171f"
  color-accent: "#86c5fa"
  color-danger: "#ec79af"
  color-neutral: "#768799"
  color-btn-fg: "#0f171f"
  font-family: "'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif"
  font-heading: "'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif"
  font-mono: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
  font-size-base: "16px"
  font-size-sm: "14px"
  font-size-heading: "1.5rem"
  radius: "8px"
  space: "8px"

  # --- Banking extras (openbanking app only; other apps ignore them) ---
  color-header-bg: "#001d46"
  color-header-fg: "#ffffff"
  color-link: "#86c5fa"
  color-credit: "#86c5fa"
  color-debit: "#f5f7fa"
  color-rule: "#f5f7fa"
