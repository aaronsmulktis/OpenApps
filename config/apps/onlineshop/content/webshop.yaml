# @package apps.onlineshop
#
# The shop's catalog. This is the pack that makes the storefront real:
#
#     uv run launch.py apps/onlineshop/content=webshop
#
# Checked in, so the shop works from a fresh clone with no setup step. It was
# generated by `scripts/fetch_webshop.py`, which stays in the tree as a way to
# rebuild or re-scope this file (a different item dump, a larger `--limit`),
# not as a prerequisite for running the shop. Hand-edits are fine; just know a
# regeneration overwrites them.
#
# Built from YWZBrandon/webshop-data (items_shuffle_1000.json), a mirror of the
# WebShop item dump (Yao et al., 2022). These are scraped Amazon listings, so
# the titles, bullets and descriptions are the retailer's own marketing copy
# and `images` holds amazon.com CDN links.

defaults:
  - default

# Hotlink the catalog's own photos rather than drawing line art. This pack is
# the one case where the URLs exist and point at real images, so a local
# browsing session gets a storefront that looks like a storefront.
#
# It is a per-pack override, not the shop-wide default (`../default.yaml`
# stays on `glyphs`), because hotlinking has two costs that only make sense to
# pay deliberately: eval nodes have no outbound network, so a screenshot-
# scored agent there is graded on a page whose imagery silently failed to
# load; and the pages reference Amazon's CDN, with whatever terms attach.
# Override back per-run with `apps.onlineshop.product_images=glyphs`.
product_images: hotlink

